# Local PostgreSQL and Redis for development and integration tests.
#   docker compose up -d --wait
#   TEST_DATABASE_URL=postgres://postgres:postgres@localhost:55432/postgres TEST_REDIS_URL=redis://localhost:56379 npm test
name: jetty-test

services:
  postgres:
    container_name: jetty-test-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jetty
    ports:
      - '55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    container_name: jetty-test-redis
    image: redis:7-alpine
    ports:
      - '56379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 20
