# Local PostgreSQL for development and integration tests (matches the 16+ requirement).
#   docker compose up -d --wait
#   TEST_DATABASE_URL=postgres://postgres:postgres@localhost:55432/postgres npm test
name: jetty-test

services:
  postgres:
    container_name: jetty-test-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jetty
    ports:
      - '55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      timeout: 3s
      retries: 20
