# Production stack for a Hostinger VPS (KVM). Run from this directory:
#   cp .env.example .env   # fill it in
#   docker compose up -d --build
# See docs/HOSTINGER.md for the full walkthrough.
name: jetty

x-api: &api
  build:
    context: ..
    dockerfile: api/Dockerfile
  image: jetty-api:latest
  restart: unless-stopped
  env_file: .env
  environment: &api-env
    NODE_ENV: production
    HOST: 0.0.0.0
    DATABASE_URL: postgres://jetty:${POSTGRES_PASSWORD}@postgres:5432/jetty
    REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    migrate: { condition: service_completed_successfully }
  networks: [internal]

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jetty
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: jetty
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jetty -d jetty']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Rate-limit counters only; disposable, so no persistence.
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:?set REDIS_PASSWORD}', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [internal]

  # Applies pending migrations, then exits. API, webhook and worker wait for it.
  migrate:
    <<: *api
    restart: 'no'
    depends_on:
      postgres: { condition: service_healthy }
    command: ['node', 'dist/db/migrate.js']

  api:
    <<: *api
    environment:
      <<: *api-env
      PORT: 4000
    command: ['node', 'dist/index.js']
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4000/healthz']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Paystack calls this directly; Caddy routes /webhooks/paystack to it.
  webhook:
    <<: *api
    environment:
      <<: *api-env
      PORT: 4001
      WEBHOOK_PORT: 4001
    command: ['node', 'dist/webhook/index.js']
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4001/healthz']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    <<: *api
    command: ['node', 'dist/worker/index.js']

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: https://${API_DOMAIN:?set API_DOMAIN}/api/v1
        NEXT_PUBLIC_SITE_URL: https://${SITE_DOMAIN:?set SITE_DOMAIN}
        NEXT_PUBLIC_MEDIA_HOST: ${MEDIA_HOST:-}
    image: jetty-frontend:latest
    restart: unless-stopped
    environment:
      # Server-side calls stay on the private network.
      API_BASE_URL: http://api:4000/api/v1
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?set REVALIDATE_SECRET}
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      APEX_DOMAIN: ${APEX_DOMAIN:?set APEX_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api, webhook, frontend]
    networks: [internal]

networks:
  internal:

volumes:
  pgdata:
  caddy_data:
  caddy_config:
